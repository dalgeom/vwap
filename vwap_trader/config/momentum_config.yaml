# Momentum Bot Configuration

strategy:
  pctile: 99.5            # top 0.5% return threshold (v3: 97→99.5)
  threshold_window: 2000  # rolling window for threshold (5min bars)
  atr_period: 20          # ATR lookback
  sl_atr_mult: 1.5        # SL = 1.5 x ATR (v2: 3.0→1.5)
  tp_rr: 1.33             # TP = SL x 1.33 (v2: 2.0→1.33, = 2×ATR)
  max_hold_bars: 12       # 1 hour (v2: 36→12, 12 x 5min)
  cooldown_bars: 12       # 1 hour cooldown per coin

risk:
  risk_pct: 0.005         # 0.5% per trade
  max_positions: 10       # max concurrent positions
  max_leverage: 3.0       # effective leverage cap

filters:
  # Option B (disabled — caused correlation concentration)
  short_only_btc_down: false
  btc_down_threshold: -0.05
  # Slippage cooldown (kept from B)
  slippage_cooldown_hours: 48
  slippage_cooldown_threshold: 1.0
  # Option G: cluster + direction cap
  max_entries_per_bar: 2          # max new entries in same 5min bar
  max_long_positions: 3           # max simultaneous long positions
  max_short_positions: 3          # max simultaneous short positions
  # Option G: pullback entry
  pullback_enabled: false          # v4.1: disabled — adverse selection with momentum strategy
  pullback_atr_mult: 0.3          # limit order at entry ± 0.3×ATR
  pullback_expire_bars: 3         # cancel if not filled in 3 bars

universe:
  min_volume_usdt: 20_000_000  # $20M 24h volume
  refresh_interval_hours: 24
  blacklist:
    - XAUTUSDT    # gold
    - XAGUSDT     # silver
    - XAUUSDT     # gold

exchange:
  candle_interval: "5"    # 5 minute candles
  candle_fetch_count: 2100  # threshold_window + buffer
  demo: true              # demo mode (true for testing)
  leverage: 5

logging:
  slippage_file: slippage_momentum.jsonl
  trades_file: trades_momentum.jsonl
  state_file: state_momentum.json
